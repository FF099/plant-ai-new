{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center mt-5">
  <div class="card p-4 shadow-sm" style="width: 380px;">
    <h4 class="mb-3 text-center">เข้าสู่ระบบผู้ดูแลระบบ</h4>
    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">ชื่อผู้ใช้</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label">รหัสผ่าน</label>
        {{ form.password }}
      </div>
      <button type="submit" class="btn btn-success w-100">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>
{% endblock %}
