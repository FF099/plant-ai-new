<!-- category_form.html -->
<!-- ใช้ฟอร์มเดียวกันทั้งตอน "เพิ่ม" (category_add) และ "แก้ไข" (category_edit) หมวดหมู่พืช
     view จะส่งตัวแปร form และ title มาให้ต่างกันตามการใช้งาน -->
{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'plants/css/style_admin.css' %}">

<!-- ส่วนหัวหน้า: แสดงชื่อฟอร์ม (เพิ่ม/แก้ไขหมวดหมู่พืช) ที่ส่งมาจาก view -->
<div class="admin-hero">
    <h2>{{ title }}</h2>
    <p>กรอกรายละเอียดหมวดหมู่พืชด้านล่าง</p>
</div>

<div class="form-card">
    <form method="post">
        {% csrf_token %}

            {% for field in form %}
                {% if field.errors %}
                    <div class="alert alert-danger mb-2">
                        {{ field.errors.0 }}
                    </div>
                {% endif %}

                {{ field.label_tag }}
                {{ field }}
            {% endfor %}

        <div class="form-actions">
            <button type="submit" class="btn btn-plant-primary">บันทึก</button>
            <a href="{% url 'management' %}?tab=categories" class="btn btn-plant-secondary">ยกเลิก</a>
        </div>
    </form>
</div>
{% endblock %}
