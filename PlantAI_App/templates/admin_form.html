<!-- admin_form.html -->
{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <h2>{{ title }}</h2>
    <hr>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">บันทึก</button>
        <a href="{% url 'management' %}?tab=admins" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>
{% endblock %}
