<!-- admin_form.html -->
<!-- ใช้ฟอร์มเดียวกันทั้งตอน "เพิ่ม" (admin_add) และ "แก้ไข" (admin_edit) ผู้ดูแลระบบ
     view จะส่งตัวแปร form และ title (ข้อความหัวเรื่อง) มาให้ต่างกันตามการใช้งาน -->
{% extends 'base.html' %}
{% block content %}
{% load static %}
<!-- CSS เฉพาะหน้าฟอร์มฝั่ง admin (ใช้ร่วมกับ category_form.html, plant_form.html, login.html) -->
<link rel="stylesheet" href="{% static 'plants/css/style_admin.css' %}">

<!-- ส่วนหัวหน้า: แสดงชื่อฟอร์ม (เพิ่ม/แก้ไขผู้ดูแลระบบ) ที่ส่งมาจาก view -->
<div class="admin-hero">
    <h2>{{ title }}</h2>
    <p>กรอกรายละเอียดผู้ดูแลระบบด้านล่าง</p>
</div>

<!-- กล่องฟอร์มหลัก -->
<div class="form-card">
    <form method="post">
        {% csrf_token %}
        <!-- // form.as_p // จะ render ฟิลด์ทั้งหมดของ AdminUserForm อัตโนมัติ
             (username, email, password) โดยแต่ละฟิลด์ครอบด้วย <p> ตาม widget ที่กำหนดไว้ใน forms.py -->
        {{ form.as_p }}
        <div class="form-actions">
            <!-- ปุ่มบันทึก: submit ฟอร์มกลับไปที่ view เดิม (admin_add หรือ admin_edit) -->
            <button type="submit" class="btn btn-plant-primary">บันทึก</button>
            <!-- ปุ่มยกเลิก: กลับไปหน้าจัดการระบบ แท็บผู้ดูแลระบบ โดยไม่บันทึกข้อมูล -->
            <a href="{% url 'management' %}?tab=admins" class="btn btn-plant-secondary">ยกเลิก</a>
        </div>
    </form>
</div>
{% endblock %}
